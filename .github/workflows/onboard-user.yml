name: Onboard New Entra ID User

# Correct 'on' section indentation:
on:
  workflow_dispatch:
    inputs:
      first_name:
        description: 'First Name'
        required: true
      last_name:
        description: 'Last Name'
        required: true
      username:
        description: 'Username (e.g. jdoe)'
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  onboard-user:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      # Execute onboarding script
      - name: Execute Onboarding Script
        env:
          AZURE_DOMAIN: "yourdomain.onmicrosoft.com"
          ONBOARDING_GROUP_ID: ${{ secrets.ONBOARDING_GROUP_ID }}
          # Pass workflow inputs directly
          USER_FIRST_NAME: ${{ inputs.first_name }}
          USER_LAST_NAME: ${{ inputs.last_name }}
          USER_USERNAME: ${{ inputs.username }}
        run: python scripts/onboard_user.py
