name: Onboard User to Entra ID

on:
  push:
    branches:
      - main # Triggers automatically when code is pushed to main
    paths:
      - "payloads/**" # Optional: only trigger when files in payloads/ are updated
  workflow_dispatch:
    inputs:
      first_name:
        description: "First Name"
        required: false
      last_name:
        description: "Last Name"
        required: false
      username:
        description: "Username / Alias"
        required: false

jobs:
  onboard:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: pip install requests

      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Execute Onboarding Script
        env:
          AZURE_DOMAIN: "Ngalemo182.onmicrosoft.com"
          ONBOARDING_GROUP_ID: ${{ secrets.ONBOARDING_GROUP_ID }}
          USER_FIRST_NAME: ${{ inputs.first_name }}
          USER_LAST_NAME: ${{ inputs.last_name }}
          USER_USERNAME: ${{ inputs.username }}
        run: python scripts/onboard_user.py
